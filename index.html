<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagro del Valle - Soluciones Agrícolas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo" style="font-size: 24px; font-weight: bold; color: #2d5a27;">Anagro <span style="color: #f39c12;">del Valle</span></div>
            <ul style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0;">
                <li><a href="#productos" style="text-decoration: none; color: #333; font-weight: bold;">Catálogo</a></li>
            </ul>
        </nav>
    </header>

    <section id="hero" style="background: #e2ede4; padding: 60px 5%; text-align: center; border-bottom: 3px solid #2d5a27;">
        <div class="hero-content">
            <h1 style="color: #2d5a27; font-size: 32px; margin-bottom: 10px;">Impulsa tu Cosecha con Tecnología Local</h1>
            <p style="color: #555; font-size: 16px; margin-bottom: 20px;">Soluciones agroquímicas de alta eficiencia para los retos actuales del agro en el Valle.</p>
            <a href="#productos" style="background: #2d5a27; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">Ver Catálogo</a>
        </div>
    </section>

    <section id="productos" style="padding: 40px 5%;">
        <h2 style="color: #2d5a27; border-bottom: 2px solid #2d5a27; padding-bottom: 10px;">Nuestros Productos</h2>
        <div id="grid-productos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
            </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
